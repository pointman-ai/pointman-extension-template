[package]
name = "hello"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.4.0" }
anyhow = "1"
serde_json = "1"
# buffa's code for proto/hello/v1/hello.proto (build.rs) uses these: keep them at the SDK's versions
buffa = { version = "0.9.2", features = ["json"] }
serde = "1"

[build-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.4.0", features = ["proto"] }

[dev-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.4.0", features = ["proto"] }
